[build-system]
requires = ["scikit-build-core", "nanobind", "jax>=0.4.31"]
build-backend = "scikit_build_core.build"

[project]
name = "npu_simulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jax", "numpy"]
description = "NPU Simulator for JAX - Custom Neural Processing Unit Implementation"

[project.optional-dependencies]
test = ["pytest", "absl-py"]
dev = ["pytest", "absl-py", "matplotlib"]